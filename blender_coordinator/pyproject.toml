[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blender-zone-coordinator"
version = "0.1.0"
description = "Local fragment coordinator for Blender and OpenAI-compatible local models"
requires-python = ">=3.10"
dependencies = ["mcp==1.12.4", "pydantic==2.11.7", "pydantic-settings==2.10.1", "Pillow>=10.4,<13"]

[project.scripts]
zonecoord = "zonecoord.__main__:main"

[tool.setuptools]
packages = ["zonecoord"]
