[project]
name = "blender-mcp"
version = "1.0.0"
description = "Control a running Blender session from any MCP-capable agent."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["mcp>=1.9"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
blender-mcp = "blender_mcp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["blender_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
